<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card Game Arena</title>
<style>
:root{color-scheme:dark;--bg:#101417;--panel:#172025;--line:#31434b;--text:#e9f0ed;--muted:#9db0b0;--gold:#f2c66d;--felt:#16483c;--felt2:#0d342d;--accent:#56d3a2;--danger:#ee8a7a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#263a3c 0,#101417 58%);color:var(--text);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input,select{font:inherit}button{border:1px solid #477769;background:#235747;color:#f5fffb;border-radius:7px;padding:9px 14px;cursor:pointer;transition:.16s ease}button:hover:not(:disabled){background:#2c725c;transform:translateY(-1px)}button:disabled{cursor:not-allowed;opacity:.45}select,input{background:#111a1e;border:1px solid var(--line);border-radius:6px;color:var(--text);padding:9px 10px}input{width:92px}
.shell{max-width:1320px;margin:0 auto;padding:22px 24px 28px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#0c2921;display:grid;place-items:center;font-weight:900}.brand h1{font-size:20px;margin:0}.brand small{color:var(--muted)}.setup{display:flex;gap:8px;align-items:center}.status{display:flex;gap:18px;align-items:center;background:rgba(23,32,37,.9);border:1px solid var(--line);padding:10px 14px;border-radius:10px;margin-bottom:16px}.status strong{color:var(--gold)}.status .turn{margin-left:auto;color:var(--accent)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}.table-wrap{min-width:0}.table{min-height:570px;border:10px solid #392b1d;border-radius:30px;background:radial-gradient(ellipse at center,var(--felt) 0,var(--felt2) 80%);box-shadow:0 18px 45px #0008,inset 0 0 0 2px #987044;position:relative;padding:26px;display:flex;flex-direction:column;justify-content:space-between}.table-head{display:flex;justify-content:center;color:#b5d3c7;letter-spacing:.08em;text-transform:uppercase;font-size:12px}.opponents{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}.seat{background:#111a1dcc;border:1px solid #51736a;border-radius:10px;padding:10px 12px;width:170px;flex:0 0 170px;box-shadow:0 5px 12px #0004}.seat.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 5px 16px #0005}.seat.me{background:#132b25ee}.seat-head{display:flex;justify-content:space-between;gap:14px}.seat-name{font-weight:700}.seat-kind{font-size:11px;color:var(--muted)}.seat-meta{color:#bdd0c8;font-size:12px;margin-top:4px;min-height:18px}.seat-cards{display:flex;gap:4px;margin-top:9px;min-height:66px;align-items:flex-start;overflow:hidden}.seat-cards .card{flex:0 0 auto}.card{width:42px;height:58px;border-radius:6px;background:#f8f4e9;color:#202326;display:flex;flex-direction:column;justify-content:space-between;padding:4px 5px;font-weight:700;box-shadow:0 2px 4px #0005;border:1px solid #d7d1c4}.card .rank{font-size:17px;line-height:1}.card .suit{font-size:16px;align-self:flex-end;line-height:1}.card.red{color:#bc3f45}.card.back{background:repeating-linear-gradient(45deg,#244b79,#244b79 4px,#d9e3ef 4px,#d9e3ef 6px);color:transparent;border-color:#ced9e8}.card.large{width:62px;height:86px}.card.large .rank{font-size:23px}.card.large .suit{font-size:23px}.center{display:flex;flex-direction:column;align-items:center;gap:9px}.pot{color:var(--gold);font-size:26px;font-weight:800}.phase{color:#b7d4ca;font-size:13px}.zone-row{display:flex;gap:8px;width:min(100%,430px)}.zone-row .zone-panel{flex:1;min-width:0}.zone-panel{border:1px solid #52766a;border-radius:8px;background:#0b2822aa;padding:8px 9px}.zone-label{color:#d4e8df;font-size:11px;letter-spacing:.02em;text-align:left;white-space:nowrap}.zone-stack{display:flex;align-items:center;justify-content:center;gap:7px;min-height:48px;margin-top:5px}.zone-stack .card{width:29px;height:40px;border-radius:4px;padding:2px;box-shadow:0 2px 5px #0008}.deck-count{color:#d4e8df;font-size:12px;white-space:nowrap}.bottom{display:flex;justify-content:center}.my-seat{width:250px;flex-basis:250px}.my-seat .seat-cards{min-height:92px}.actions-panel{margin-top:15px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}.actions-title{font-weight:700;margin-bottom:10px}.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.action-row{display:flex;gap:6px;align-items:center}.action-row label{font-size:12px;color:var(--muted)}.hint{color:var(--muted);font-size:13px}.side{display:flex;flex-direction:column;gap:12px}.panel{background:rgba(23,32,37,.92);border:1px solid var(--line);border-radius:10px;padding:14px}.panel h2{font-size:14px;margin:0 0 10px;color:#cfe2dc}.panel pre{margin:0;white-space:pre-wrap;word-break:break-word;color:#b9cbc6;font-size:12px;max-height:190px;overflow:auto}.feed{height:345px;overflow:auto;display:flex;flex-direction:column;gap:7px}.feed-item{border-left:2px solid #477769;padding-left:9px;color:#bdcfca;font-size:12px}.feed-item.intent{border-color:var(--gold);color:#f1d59a}.feed-item.error{border-color:var(--danger);color:#ffaaa0}.empty{color:var(--muted);font-size:13px}
.end-overlay{position:absolute;inset:0;z-index:5;display:grid;place-items:center;border-radius:20px;background:rgba(6,18,16,.72);opacity:0;visibility:hidden;pointer-events:none}.end-overlay.visible{visibility:visible;animation:end-overlay-in .5s ease-out forwards}.end-message{color:#f5d98e;font-size:clamp(28px,5vw,48px);font-weight:800;text-shadow:0 3px 18px #000;animation:end-message-in .65s cubic-bezier(.2,.8,.2,1) both}@keyframes end-overlay-in{from{opacity:0}to{opacity:1}}@keyframes end-message-in{from{opacity:0;transform:translateY(14px) scale(.88)}to{opacity:1;transform:translateY(0) scale(1)}}@media(prefers-reduced-motion:reduce){.end-overlay.visible,.end-message{animation:none;opacity:1}}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.feed{height:220px}.table{min-height:520px;padding:18px 12px}.setup{flex-wrap:wrap}.topbar{align-items:flex-start;flex-direction:column}}@media(max-width:560px){.shell{padding:14px 10px}.side{display:flex}.status{gap:8px;flex-wrap:wrap}.status .turn{margin-left:0;width:100%}.table{border-width:6px;border-radius:20px}.seat{min-width:132px}.card{width:35px;height:50px}.card.large{width:54px;height:76px}}
.modal{display:none;position:fixed;z-index:999;inset:0;background:#000c;align-items:center;justify-content:center}.modal.show{display:flex}.modal-box{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:24px;max-width:520px;width:90%;max-height:85vh;overflow-y:auto}.modal-title{font-size:20px;margin:0 0 18px;color:var(--accent)}.plist{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}.pitem{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px}.phead{display:flex;justify-content:space-between;margin-bottom:10px}.llm-inputs{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}.llm-inputs label{display:block;margin:8px 0 4px;font-size:13px;color:var(--muted)}.llm-inputs input{width:100%}.mbtn{display:flex;gap:10px;justify-content:flex-end}</style>
</head>
<body>
<main class="shell">
<header class="topbar"><div class="brand"><div class="mark">A</div><div><h1>Card Game Arena</h1><small>AI 对局实验桌</small></div></div><button id="cfgBtn" style="background:#4a5a8a;margin-right:8px">⚙ 配置</button><div class="setup"><select id="game"></select><button id="start">开始新对局</button></div></header>
<section class="status"><span id="gameLabel">未开始</span><span>底池 <strong id="potLabel">-</strong></span><span>阶段 <strong id="phaseLabel">-</strong></span><span class="turn" id="turnLabel">等待开始</span></section>
<div class="layout"><section class="table-wrap"><div class="table"><div class="table-head">公开牌桌</div><div id="opponents" class="opponents"></div><div class="center"><div id="potText" class="pot">准备开始</div><div class="zone-row"><div class="zone-panel"><div class="zone-label">cardZones.deck · 牌堆</div><div class="zone-stack"><div id="deckBack" class="card back"></div><div id="deckCount" class="deck-count">剩余 - 张</div></div></div><div class="zone-panel"><div class="zone-label">cardZones.discard · 弃牌堆</div><div class="zone-stack"><div id="discardBack" class="card back"></div><div id="discardCount" class="deck-count">0 张</div></div></div></div><div id="phaseText" class="phase"></div></div><div class="bottom"><div id="me" class="seat me my-seat"></div></div><div id="endOverlay" class="end-overlay" role="status" aria-live="polite" aria-hidden="true"><div class="end-message">游戏结束</div></div></div><section class="actions-panel"><div class="actions-title">你的动作</div><div id="actions" class="actions"><span class="hint">开始对局后，轮到你时会显示可用动作。</span></div></section></section><aside class="side"><section class="panel"><h2>当前视角</h2><pre id="observation">尚未创建对局</pre></section><section class="panel"><h2>牌局动态</h2><div id="feed" class="feed"><span class="empty">AI 的动作和策略意图会显示在这里。</span></div></section></aside></div>
<div id="cfgModal" class="modal"><div class="modal-box"><h2 class="modal-title">玩家配置</h2><div id="plist" class="plist"></div><button onclick="addP()" style="background:#3a6a5a;width:100%;margin-bottom:14px">+ 添加玩家</button><div class="mbtn"><button onclick="closeM()" style="background:#555">取消</button><button onclick="saveP()">保存</button></div></div></div></main>
<script>
const game=document.querySelector('#game'),start=document.querySelector('#start'),gameLabel=document.querySelector('#gameLabel'),potLabel=document.querySelector('#potLabel'),phaseLabel=document.querySelector('#phaseLabel'),turnLabel=document.querySelector('#turnLabel'),potText=document.querySelector('#potText'),phaseText=document.querySelector('#phaseText'),deckCount=document.querySelector('#deckCount'),discardCount=document.querySelector('#discardCount'),opponents=document.querySelector('#opponents'),me=document.querySelector('#me'),actions=document.querySelector('#actions'),observation=document.querySelector('#observation'),feed=document.querySelector('#feed'),endOverlay=document.querySelector('#endOverlay');let id,source,playing=false,eventQueue=Promise.resolve(),playerStats=[];
function addFeed(text,kind=''){if(feed.querySelector('.empty'))feed.replaceChildren();const el=document.createElement('div');el.className='feed-item '+kind;el.textContent=text;feed.prepend(el);while(feed.children.length>30)feed.lastChild.remove()}
function card(id,hidden=false){const el=document.createElement('div');el.className='card '+(hidden?'back':'');if(hidden)return el;const m=/^(10|[2-9JQKA])([CDHS])$/.exec(String(id)||'');if(!m){el.textContent=id||'?';return el}const suit={C:'♣',D:'♦',H:'♥',S:'♠'}[m[2]];if(suit==='♦'||suit==='♥')el.classList.add('red');const rank=document.createElement('span'),symbol=document.createElement('span');rank.className='rank';rank.textContent=m[1];symbol.className='suit';symbol.textContent=suit;el.append(rank,symbol);return el}
function cardRow(value){const wrap=document.createElement('div');wrap.className='seat-cards';if(Array.isArray(value))value.forEach(c=>wrap.append(card(c)));else {for(const c of (value?.revealed||[]))wrap.append(card(c));for(let i=0;i<(value?.hidden||0);i++)wrap.append(card('',true))}return wrap}
function readPath(s,path,p){let value=s;for(const part of String(path||'').split('.'))value=value?.[part];return value&&typeof value==='object'&&p in value?value[p]:'-'}
function seat(root,p,s,isMe,active,stats=[]){root.className='seat '+(isMe?'me ':'')+(active?'active':'');root.replaceChildren();const head=document.createElement('div');head.className='seat-head';head.innerHTML='<span class="seat-name"></span><span class="seat-kind"></span>';head.querySelector('.seat-name').textContent=p+(isMe?'（你）':'');head.querySelector('.seat-kind').textContent=isMe?'HUMAN':'AI';const meta=document.createElement('div');meta.className='seat-meta';meta.textContent=stats.map(x=>x.label+' '+readPath(s,x.path,p)).join(' · ');root.append(head,meta,cardRow(s?.cardZones?.hands?.[p]))}
function renderActions(x){actions.replaceChildren();if(!x.legalActions?.length){const h=document.createElement('span');h.className='hint';h.textContent='当前没有可执行动作，等待其他玩家。';actions.append(h);return}for(const a of x.legalActions){const row=document.createElement('span');row.className='action-row';const schema=x.actionSchemas.find(s=>s.type===a.type),args={...(a.args||{})};for(const d of schema?.args||[]){if(args[d.name]!==undefined)continue;const c=a.constraints?.[d.name]||{},label=document.createElement('label');label.textContent=d.name;const input=document.createElement('input');input.name=d.name;input.type=d.type==='integer'||d.type==='number'?'number':'text';if(c.min!==undefined)input.min=c.min;if(c.max!==undefined)input.max=c.max;if(c.step!==undefined)input.step=c.step;input.value=c.min??'';label.append(input);row.append(label)}const b=document.createElement('button');b.textContent=({bet:'下注',fold:'弃牌',draw_card:'抽牌'}[a.type]||a.type);b.onclick=async()=>{for(const input of row.querySelectorAll('input')){const d=schema.args.find(s=>s.name===input.name);args[input.name]=['integer','number'].includes(d?.type)?Number(input.value):input.value}b.disabled=true;try{const r=await fetch('/arena/'+id+'/action',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({playerId:'human',expectedSequence:x.sequence,action:{type:a.type,actor:'human',args}})});if(!r.ok)throw Error((await r.json()).error?.message||'动作提交失败')}catch(e){addFeed(e.message,'error');await refresh()}};row.append(b);actions.append(row)}}
function renderState(s,active=[],stats=playerStats,status='running'){if(!s)return;const players=s.players||Object.keys(s.balances||{}),turn=new Set(active),ended=status==='ended';gameLabel.textContent='对局 '+id;potLabel.textContent=s.pot??'-';phaseLabel.textContent=s.phase??'-';potText.textContent=s.pot===undefined?'准备开始':'底池 '+s.pot;phaseText.textContent=s.phase?('第 '+(s.round??0)+' 轮 · '+s.phase):'';const deck=s.cardZones?.deck;const deckN=Number.isInteger(deck?.hidden)?deck.hidden:Array.isArray(deck)?deck.length:0;deckCount.textContent='剩余 '+deckN+' 张';deckBack.hidden=deckN===0;turnLabel.textContent=ended?'游戏结束':turn.has('human')?'轮到你行动':'等待其他玩家行动';const discarded=s.cardZones?.discard;const discardN=Array.isArray(discarded)?discarded.length:Number.isInteger(discarded?.hidden)?discarded.hidden:0;discardCount.textContent=discardN+' 张';discardBack.hidden=discardN===0;endOverlay.classList.toggle('visible',ended);endOverlay.setAttribute('aria-hidden',String(!ended));opponents.replaceChildren();for(const p of players.filter(p=>p!=='human')){const el=document.createElement('div');seat(el,p,s,false,turn.has(p),stats);opponents.append(el)}seat(me,'human',s,true,turn.has('human'),stats);observation.textContent=JSON.stringify(s,null,2)}
function render(x){playerStats=x.presentation?.playerStats||[];renderState(x.observation,x.activeActors||[],playerStats,x.status);renderActions(x)}
async function playStages(stages,status='running'){playing=true;actions.replaceChildren();const hint=document.createElement('span');hint.className='hint';hint.textContent='正在播放牌局过程…';actions.append(hint);for(const stage of stages||[]){renderState(stage.state||stage.views?.human||stage.publicState,[],playerStats);addFeed(eventName(stage.eventType,stage.actor));await new Promise(r=>setTimeout(r,550))}if(status==='ended')renderState(stages?.at(-1)?.state||stages?.at(-1)?.views?.human||stages?.at(-1)?.publicState,[],playerStats,'ended');playing=false}
function eventName(type,actor){return ({cards_drawn:'抽牌',cards_revealed:'亮牌',zone_shuffled:'洗牌',value_added:'计分变化',items_moved:'移动牌',game_finished:'牌局结束'}[type]||type)+(actor?' · '+actor:'')}
async function refresh(){if(!id||playing)return;const r=await fetch('/arena/'+id+'/decision?playerId=human');if(r.ok)render(await r.json())}
async function startGame(){start.disabled=true;endOverlay.classList.remove('visible');endOverlay.setAttribute('aria-hidden','true');try{const r=await fetch('/arena',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({gameId:game.value,players:window.pCfg||[{id:'human',kind:'human'},{id:'bot-1',kind:'ai'}]})}),x=await r.json();if(!r.ok)throw Error(x.error?.message||'创建失败');id=x.instanceId;feed.replaceChildren();addFeed('牌局创建');source=new EventSource('/arena/'+id+'/events?playerId=human');source.onmessage=e=>{const v=JSON.parse(e.data);eventQueue=eventQueue.then(async()=>{if(v.type==='agent_intent')addFeed(v.actor+'：'+v.payload.intent.text,'intent');else if(v.type==='transition'){addFeed(v.actor+' 执行 '+v.payload.action.type);await playStages(v.payload.stages,v.payload.status);await refresh()}else if(v.type==='decision_requested'){turnLabel.textContent=v.actor==='human'?'轮到你行动':v.actor+' 正在行动';await refresh()}else if(v.type==='arena_ended'){addFeed('游戏结束','intent');endOverlay.classList.add('visible');endOverlay.setAttribute('aria-hidden','false');await refresh()}}).catch(e=>addFeed(e.message,'error'))};await refresh()}catch(e){addFeed(e.message,'error')}finally{start.disabled=false}}
fetch('/games').then(r=>r.json()).then(xs=>xs.forEach(x=>{const o=document.createElement('option');o.value=x.gameId;o.textContent=x.gameId==='zha-jin-hua'?'炸金花':x.gameId==='high-card-race'?'High Card':x.gameId;game.append(o)}));start.onclick=startGame;
window.pCfg=[{id:'human',kind:'human'},{id:'bot-1',kind:'bot',strategy:'random'}];function openM(){document.getElementById('cfgModal').classList.add('show');renderP()}function closeM(){document.getElementById('cfgModal').classList.remove('show')}function renderP(){const c=document.getElementById('plist');c.innerHTML=window.pCfg.map((p,i)=>`<div class=pitem><div class=phead><strong>玩家${i+1}</strong><button onclick=rmP(${i}) style='padding:4px 10px;font-size:12px'>删除</button></div><label style='font-size:13px;color:var(--muted)'>类型</label><select onchange=chgK(${i},this.value) style=width:100%><option value=human ${p.kind==='human'?'selected':''}>真人</option><option value=bot ${p.kind==='bot'?'selected':''}>Bot</option><option value=llm ${p.kind==='llm'?'selected':''}>LLM</option></select>${p.kind==='bot'?`<div style=margin-top:8px><label style='font-size:13px'>策略</label><select onchange=chgS(${i},this.value) style=width:100%><option value=random ${p.strategy==='random'?'selected':''}>随机</option><option value=greedy ${p.strategy==='greedy'?'selected':''}>贪婪</option></select></div>`:''}${p.kind==='llm'?`<div class=llm-inputs><label>API Key</label><input type=password value='${p.apiKey||''}' onchange=setF(${i},'apiKey',this.value) placeholder='sk-...'><label>URL</label><input value='${p.apiUrl||'https://api.deepseek.com/v1/chat/completions'}' onchange=setF(${i},'apiUrl',this.value)><button onclick=testLLM(${i}) style='margin-top:8px;width:100%;background:#4a7a6a'>测试连接</button><label>模型</label>${p.availableModels&&p.availableModels.length>0?`<select onchange=setF(${i},'model',this.value) style=width:100%>${p.availableModels.map(m=>`<option value='${m}' ${p.model===m?'selected':''}>${m}</option>`).join('')}</select>`:`<input value='${p.model||'deepseek-chat'}' onchange=setF(${i},'model',this.value)>`}</div>`:''}</div>`).join('')}function addP(){window.pCfg.push({id:`p${window.pCfg.length+1}`,kind:'bot',strategy:'random'});renderP()}function rmP(i){window.pCfg.splice(i,1);renderP()}function chgK(i,k){window.pCfg[i].kind=k;if(k==='bot')window.pCfg[i].strategy='random';if(k==='llm'){window.pCfg[i].apiUrl='https://api.deepseek.com/v1/chat/completions';window.pCfg[i].model='deepseek-chat'}renderP()}function chgS(i,s){window.pCfg[i].strategy=s}function setF(i,f,v){window.pCfg[i][f]=v}async function testLLM(i){const p=window.pCfg[i];if(!p.apiKey||!p.apiUrl){alert('请先填写API Key和URL');return}const btn=event.target;btn.disabled=true;btn.textContent='测试中...';try{const res=await fetch(p.apiUrl.replace('/chat/completions','/models'),{headers:{'Authorization':`Bearer ${p.apiKey}`}});if(!res.ok)throw new Error(`HTTP ${res.status}`);const data=await res.json();if(data.data&&Array.isArray(data.data)){const models=data.data.map(m=>m.id);p.availableModels=models;if(!p.model&&models.length>0)p.model=models[0];renderP();alert(`成功获取${models.length}个模型`)}else{alert('未找到模型列表')}}catch(e){alert('测试失败: '+e.message)}finally{btn.disabled=false;btn.textContent='测试连接'}}function saveP(){closeM()}window.addEventListener('DOMContentLoaded',()=>{document.getElementById('cfgBtn').onclick=openM});
</script>
</body>
</html>
